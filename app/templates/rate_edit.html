<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Rate</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="centered-page">
    <div class="card">
        <h1>Edit Rate</h1>
        <p class="pair"><span>{{ from_code }}</span> &rarr; <span>{{ to_code }}</span></p>

        <form action="{{ url_for('edit_xrate', from_currency=from_currency, to_currency=to_currency) }}" method="POST">
            <div class="form-group">
                <label for="new_rate">New rate:</label>
                <input type="text" id="new_rate" name="new_rate" placeholder="Enter rate..." required>
            </div>

            <div class="actions">
                <a class="btn-back" href="{{ url_for('view_rates') }}">Back</a>
                <button class="btn btn-save" type="submit">Save</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
